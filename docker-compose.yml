# Long polling needs no inbound traffic, so there are no ports at all.
name: deel-advisor

services:
  bot:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: deel-advisor:latest
    container_name: deel-advisor
    env_file: .env
    volumes:
      - data:/app/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    pids_limit: 64
    # aiogram's pydantic models alone take ~170 MB.
    mem_limit: 320m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '3'}

volumes:
  data:
