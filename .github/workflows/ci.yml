name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Prettier (JSON, YAML, TypeScript)
        run: npx --yes prettier@3.9.10 --check .
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run pytest -q --cov --cov-report=term-missing
      - name: Shell
        run: shellcheck deploy/*.sh

  image:
    # Only the server builds the image otherwise; a COPY that misses a file must fail here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build --build-arg GIT_SHA="$GITHUB_SHA" -t deel-advisor:ci .
      - name: Smoke-test the installed package
        # -P keeps /app off sys.path, so this imports the wheel in site-packages, as production
        # does, and loads + validates every country file bundled with it.
        run: |
          docker run --rm --network none -e BOT_TOKEN=0:x deel-advisor:ci python -P -c '
          import importlib, pkgutil, deel_advisor
          for m in pkgutil.walk_packages(deel_advisor.__path__, "deel_advisor."):
              importlib.import_module(m.name)
          from deel_advisor import catalog
          data = catalog.load()
          assert len(data.countries) == 5, data.countries
          print("ok:", ", ".join(c.code for c in data.countries))
          '

  deploy:
    # Only after both jobs are green, only from main, never from a pull request.
    needs: [check, image]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://t.me/deel_hea_unofficial_bot
    steps:
      - name: Deploy over SSH
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          test -n "$HOST" || { echo "DEPLOY_HOST is not set"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned host key, not accept-new: the first connection is the one worth protecting.
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          # The forced command runs deploy.sh whatever is asked; the sha tells it which tested
          # commit to deploy, so two quick pushes cannot ship an untested one.
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/id_ed25519 "$USER@$HOST" "$GITHUB_SHA"
