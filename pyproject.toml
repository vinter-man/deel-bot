[project]
name = "deel-advisor"
version = "1.0.0"
description = "Unofficial Telegram bot: employer cost of employment, EOR vs own entity, and the break-even point."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31,<4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.16",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "respx>=0.23",
    "ruff>=0.17",
    "mypy>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deel_advisor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["deel_advisor"]
branch = true
omit = ["deel_advisor/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF", "PT", "DTZ", "S", "N", "C4", "PIE", "RET"]
# RUF001: the bot's copy is Cyrillic on purpose. S101: pytest asserts.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PT011"]
# User-facing copy reads better as one string per message than wrapped at an arbitrary column.
"deel_advisor/i18n.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["deel_advisor", "scripts"]
plugins = ["pydantic.mypy"]
